[alias]
xtask = "run --package xtask --"

# === OpenHarmony / HarmonyOS NEXT cross-compile (added by ohos port) ===
# Windows host: drive the cross-compile with the OHOS NDK's native PE clang.exe / llvm-ar.exe
# (NOT the aarch64-unknown-linux-ohos-clang shell wrapper: on Windows a .sh wrapper is not
# executable, os error 193). The OHOS sysroot is supplied through link-arg so the staticlib
# links against the OHOS C runtime even though cargo only asks for an .a.
[target.aarch64-unknown-linux-ohos]
ar = "C:/ohos-sdk/default/openharmony/native/llvm/bin/llvm-ar.exe"
linker = "C:/ohos-sdk/default/openharmony/native/llvm/bin/clang.exe"
rustflags = [
    "-Clink-arg=--target=aarch64-linux-ohos",
    "-Clink-arg=--sysroot=C:/ohos-sdk/default/openharmony/native/sysroot",
]

[env]
# The application (client) id MailCraft presents to Microsoft's sign-in page: the project's own
# registration (multitenant, personal accounts too, public client with the redirect URI
# http://localhost). An identifier, not a secret; it is compiled into the desktop app and the CLI
# as the default. Set the variable yourself to build with another registration.
MAILCRAFT_MS_CLIENT_ID = "6e83816e-f26c-455a-9253-494b784e61fa"

# Issue #232: the project's Google Desktop OAuth client is injected into release builds from the
# repository secrets of the same names (package.yml); a build from source alone has none.
# Set both yourself to build with a registration of your own; never use another application's client.
# Google's desktop client "secret" is not confidential, but never place user tokens here.
MAILCRAFT_GOOGLE_CLIENT_ID = ""
MAILCRAFT_GOOGLE_CLIENT_SECRET = ""

# Issue #956: where Help › Report a Problem › Send report sends a report the owner wrote, on their
# click alone: the project's report relay, which files it in a private repository for the
# maintainers. A fork that sets it empty offers Open on GitHub alone. An address, not a secret.
MAILCRAFT_REPORT_URL = "https://mailcraft.work/api/report"

# OHOS NDK toolchain for the cross-compile above.
LIBCLANG_PATH = "C:/ohos-sdk/default/openharmony/native/llvm/lib"
CC_aarch64_unknown_linux_ohos = "C:/ohos-sdk/default/openharmony/native/llvm/bin/clang.exe"
AR_aarch64_unknown_linux_ohos = "C:/ohos-sdk/default/openharmony/native/llvm/bin/llvm-ar.exe"
CXX_aarch64_unknown_linux_ohos = "C:/ohos-sdk/default/openharmony/native/llvm/bin/clang++.exe"
CFLAGS_aarch64_unknown_linux_ohos = "--target=aarch64-linux-ohos --sysroot=C:/ohos-sdk/default/openharmony/native/sysroot"
CXXFLAGS_aarch64_unknown_linux_ohos = "--target=aarch64-linux-ohos --sysroot=C:/ohos-sdk/default/openharmony/native/sysroot"
